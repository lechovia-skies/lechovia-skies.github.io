<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lechovia Skies</title>
    <!--
      GitHub Pages shows this page for any address on lechovia-skies.github.io that has nothing behind it: a link cut
      short (chat apps drop the last "." of "/._." and open "/._"), an old address such as /lechovia-sky/, or a typo.
      It sends the visitor on to the game at /._./. Inside /._./ itself it stays put, so a missing game file can never
      loop back here.
    -->
    <script>
      if (!location.pathname.startsWith('/._./')) location.replace('/._./' + location.search + location.hash);
    </script>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1117; color: #cfe3d6; font: 16px/1.5 system-ui, sans-serif; text-align: center; }
      a { color: #63ff95; }
    </style>
  </head>
  <body>
    <p>Nothing here.<br />Lechovia Skies is at <a href="/._./">lechovia-skies.github.io/._./</a></p>
  </body>
</html>
